name: EZTV mirror diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install HTTP client
        run: python -m pip install --disable-pip-version-check requests

      - name: Probe EZTV mirrors
        run: |
          python - <<'PY'
          import requests

          mirrors = (
              "https://eztvx.to",
              "https://eztv1.xyz",
              "https://eztv.wf",
              "https://eztv.tf",
              "https://eztv.yt",
          )
          expected_imdb_id = "27543562"

          for mirror in mirrors:
              try:
                  response = requests.get(
                      f"{mirror}/api/get-torrents",
                      params={"imdb_id": expected_imdb_id, "limit": 1},
                      timeout=20,
                  )
                  status = str(response.status_code)
                  content_type = response.headers.get("Content-Type", "") or "(missing)"

                  try:
                      payload = response.json()
                  except ValueError:
                      json_valid = False
                      has_expected_imdb_id = False
                  else:
                      json_valid = True
                      has_expected_imdb_id = (
                          isinstance(payload, dict)
                          and str(payload.get("imdb_id", "")) == expected_imdb_id
                      )

                  server = response.headers.get("Server", "").casefold()
                  has_cloudflare_headers = bool(
                      response.headers.get("CF-RAY")
                      or response.headers.get("CF-Mitigated")
                      or "cloudflare" in server
                  )
                  if response.status_code in {401, 403, 429, 451, 503}:
                      block_signal = "cloudflare_or_edge" if has_cloudflare_headers else "http_access_denied"
                  elif has_cloudflare_headers:
                      block_signal = "edge_present_not_blocked"
                  else:
                      block_signal = "none"
              except requests.RequestException:
                  status = "transport_error"
                  content_type = "(none)"
                  json_valid = False
                  has_expected_imdb_id = False
                  block_signal = "transport_or_network"

              print(
                  f"mirror={mirror.removeprefix('https://')} "
                  f"status={status} "
                  f"content_type={content_type!r} "
                  f"json_valid={'yes' if json_valid else 'no'} "
                  f"imdb_id_expected={'yes' if has_expected_imdb_id else 'no'} "
                  f"block_signal={block_signal}"
              )
          PY
