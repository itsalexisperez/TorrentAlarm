name: TorrentAlarm

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: torrent-alarm
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Check active episodes and notify Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python alarm_once.py

      - name: Reconcile Smart Scheduler
        if: ${{ always() }}
        env:
          CRONJOB_API_KEY: ${{ secrets.CRONJOB_API_KEY }}
          CRONJOB_JOB_ID: ${{ vars.CRONJOB_JOB_ID }}
          SMART_SCHEDULER_ENABLED: ${{ vars.SMART_SCHEDULER_ENABLED }}
        run: python reconcile_scheduler.py

      - name: Persist notification state
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail

          changed_files="$(git status --short --untracked-files=all | sed -E 's/^.. //')"
          if [ -n "$changed_files" ] && [ "$changed_files" != "state.json" ]; then
            echo "Unexpected file changes detected:"
            printf '%s\n' "$changed_files"
            exit 1
          fi

          if git diff --quiet -- state.json; then
            echo "state.json unchanged; nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- state.json

          staged_files="$(git diff --cached --name-only)"
          if [ "$staged_files" != "state.json" ]; then
            echo "Refusing to commit files other than state.json:"
            printf '%s\n' "$staged_files"
            git reset
            exit 1
          fi

          git commit -m "chore: update TorrentAlarm notification state"
          git fetch origin main

          if ! git rebase origin/main; then
            echo "Could not safely rebase onto the latest main; refusing to push."
            git rebase --abort || true
            exit 1
          fi

          git push origin HEAD:main
